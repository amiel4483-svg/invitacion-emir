  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; padding:0; overflow-x:hidden; }
    
    body {
      font-family:'Nunito', sans-serif;
      min-height:100vh;
      background: radial-gradient(circle at 50% 10%, #3b1e6d 0%, #1a0b2e 60%, #0d0618 100%);
      color:#4a2b86;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* ============ ANIMACIONES ============ */
    @keyframes floaty { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-15px) rotate(2deg);} }
    @keyframes floatyReverse { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-15px) rotate(-2deg);} }
    @keyframes twinkle { 0%,100%{opacity:.2;} 50%{opacity:.9;} }
    @keyframes spinShield { from{transform:translate(-50%,-50%) rotate(0deg);} to{transform:translate(-50%,-50%) rotate(360deg);} }
    @keyframes enterFromBottom { from{opacity:0; transform:translateY(40px);} to{opacity:1; transform:translateY(0);} }
    @keyframes gemBounce { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-8px) scale(1.05);} }
    @keyframes popGem { 0%{transform:scale(1);} 50%{transform:scale(1.4);} 100%{transform:scale(1.2);} }
    
    @keyframes spinPortal { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinPortalReverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    
    @keyframes portalPulse { 
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px #fff) drop-shadow(0 0 40px #ff69b4); } 
      50% { transform: scale(1.05); filter: drop-shadow(0 0 40px #fff) drop-shadow(0 0 80px #ffeb3b); } 
    }
    
    @keyframes gemCharging {
      0% { transform: scale(1) rotate(0deg) translate(0, 0); filter: brightness(1) drop-shadow(0 0 20px #fff) drop-shadow(0 0 40px #ff69b4); }
      10% { transform: scale(1.02) rotate(-2deg) translate(-2px, 1px); filter: brightness(1.3) drop-shadow(0 0 25px #fff) drop-shadow(0 0 50px #ffeb3b); }
      20% { transform: scale(1.04) rotate(2deg) translate(2px, -1px); filter: brightness(1.5) drop-shadow(0 0 30px #fff) drop-shadow(0 0 60px #ffeb3b); }
      30% { transform: scale(1.06) rotate(-3deg) translate(-3px, 2px); filter: brightness(1.7) drop-shadow(0 0 40px #fff) drop-shadow(0 0 80px #ffeb3b); }
      40% { transform: scale(1.08) rotate(3deg) translate(3px, -2px); filter: brightness(1.9) drop-shadow(0 0 45px #fff) drop-shadow(0 0 90px #ffeb3b); }
      50% { transform: scale(1.10) rotate(-4deg) translate(-4px, 3px); filter: brightness(2.1) drop-shadow(0 0 50px #fff) drop-shadow(0 0 100px #ffeb3b); }
      60% { transform: scale(1.12) rotate(4deg) translate(4px, -3px); filter: brightness(2.3) drop-shadow(0 0 60px #fff) drop-shadow(0 0 120px #ffeb3b); }
      70% { transform: scale(1.14) rotate(-5deg) translate(-5px, 4px); filter: brightness(2.5) drop-shadow(0 0 70px #fff) drop-shadow(0 0 140px #ffeb3b); }
      80% { transform: scale(1.16) rotate(5deg) translate(5px, -4px); filter: brightness(2.7) drop-shadow(0 0 80px #fff) drop-shadow(0 0 160px #ffeb3b); }
      90% { transform: scale(1.18) rotate(-6deg) translate(-6px, 5px); filter: brightness(3) drop-shadow(0 0 90px #fff) drop-shadow(0 0 180px #ffeb3b); }
      100% { transform: scale(1.20) rotate(0deg) translate(0, 0); filter: brightness(3.5) drop-shadow(0 0 100px #fff) drop-shadow(0 0 200px #ffeb3b); }
    }
    
    @keyframes electricDischarge {
      0% { transform: scale(0.3) rotate(var(--angle)); opacity: 1; }
      30% { transform: scale(1) rotate(var(--angle)); opacity: 1; }
      100% { transform: scale(1.3) rotate(var(--angle)) translateX(80px); opacity: 0; }
    }
    
    @keyframes staticSpark {
      0% { transform: scale(0) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
    }
    
    @keyframes starTwinkle {
      0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
    }
    
    @keyframes particleAbsorb {
      0% { transform: translate(var(--start-x), var(--start-y)) scale(1); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translate(0, 0) scale(0.2); opacity: 0; }
    }
    
    @keyframes ringExpand {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 20px; }
      100% { transform: translate(-50%, -50%) scale(5); opacity: 0; border-width: 2px; }
    }
    
    @keyframes gemSplitLeftZigzag {
      0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; }
      15% { transform: translate(calc(-50% - 20px), calc(-50% - 15px)) rotate(-5deg); opacity: 1; }
      50% { transform: translate(calc(-50% - 120px), 30vh) rotate(-45deg); opacity: 0.8; }
      100% { transform: translate(calc(-50% - 250px), 100vh) rotate(-360deg); opacity: 0; }
    }
    @keyframes gemSplitRightZigzag {
      0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; }
      15% { transform: translate(calc(-50% + 20px), calc(-50% - 15px)) rotate(5deg); opacity: 1; }
      50% { transform: translate(calc(-50% + 120px), 30vh) rotate(45deg); opacity: 0.8; }
      100% { transform: translate(calc(-50% + 250px), 100vh) rotate(360deg); opacity: 0; }
    }
    
    @keyframes shardFall {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      20% { transform: translate(calc(var(--tx) * 0.4), calc(var(--ty) * 0.3 - 50px)) rotate(calc(var(--rot) * 0.3)) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), 100vh) rotate(var(--rot)) scale(0.5); opacity: 0; }
    }
    
    @keyframes shockwave {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; box-shadow: 0 0 30px #fff; }
      100% { transform: translate(-50%, -50%) scale(6); opacity: 0; box-shadow: 0 0 100px #7e57c2; }
    }
    
    @keyframes sparkleFly {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
    }
    
    @keyframes swordSwingVertical {
      0%, 100% { transform: translateY(-50%) rotate(90deg) translateX(0); }
      50% { transform: translateY(-50%) rotate(90deg) translateX(-6px); }
    }

    @keyframes frameGlow {
      0%, 100% { box-shadow: 0 0 30px rgba(180, 150, 255, 0.6), inset 0 0 40px rgba(255, 255, 255, 0.4), 0 20px 50px rgba(0,0,0,0.5); }
      50% { box-shadow: 0 0 50px rgba(220, 180, 255, 0.9), inset 0 0 50px rgba(255, 255, 255, 0.6), 0 20px 50px rgba(0,0,0,0.5); }
    }

    @keyframes screenCrack {
      0% { opacity: 0; transform: scale(0.8); }
      20% { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
    
    @keyframes crackDraw {
      0% { stroke-dashoffset: 1000; opacity: 0; }
      20% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }

    @keyframes selectedGlowYes {
      0%, 100% { filter: drop-shadow(0 0 15px #ffeb3b) drop-shadow(0 0 30px #ff69b4) brightness(1.2); transform: scale(1.05); }
      50% { filter: drop-shadow(0 0 30px #ffeb3b) drop-shadow(0 0 50px #ff69b4) brightness(1.5); transform: scale(1.15); }
    }
    @keyframes selectedGlowNo {
      0%, 100% { filter: drop-shadow(0 0 15px #b39ddb) drop-shadow(0 0 30px #7e57c2) brightness(1.2); transform: scale(1.05); }
      50% { filter: drop-shadow(0 0 30px #b39ddb) drop-shadow(0 0 50px #7e57c2) brightness(1.5); transform: scale(1.15); }
    }

    @keyframes energyRingPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 235, 59, 0.6), inset 0 0 20px rgba(255, 235, 59, 0.4); }
      50% { box-shadow: 0 0 50px rgba(255, 235, 59, 1), inset 0 0 50px rgba(255, 235, 59, 0.8); }
    }

    .anim-float { animation: floaty 4s ease-in-out infinite; }

    /* ============ PANTALLA DE INICIO ============ */
    #start-overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at center, #1a0b2e 0%, #000 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 500; color: #fff; text-align: center; padding: 20px;
      transition: opacity 0.8s ease-out;
    }
    .start-title { font-family:'Fredoka One', cursive; font-size: 2.5rem; color: #ff69b4; margin: 0 0 5px; text-shadow: 0 0 15px rgba(255,105,180,0.8); }
    .start-sub { color: #b39ddb; font-weight: 700; letter-spacing: .2em; font-size: 0.9rem; margin-bottom: 30px; }
    .gem-start-img { width: 140px; height: 140px; object-fit: contain; animation: gemBounce 2s infinite ease-in-out; margin-bottom: 30px; filter: drop-shadow(0 0 20px rgba(255,105,180,0.6)); }
    .btn-start {
      background: linear-gradient(135deg, #ec4899, #8b5cf6); border: none; padding: 16px 50px; border-radius: 50px;
      color: #fff; font-size: 1.2rem; font-family: 'Fredoka One', cursive; cursor: pointer;
      box-shadow: 0 10px 30px rgba(236,72,153,0.5); transition: transform 0.2s;
    }
    .btn-start:active { transform: scale(0.95); }

    /* ============ FONDO ============ */
    .sky-star { position: fixed; color: #fff; pointer-events: none; z-index: 1; animation: twinkle 3s infinite; text-shadow: 0 0 8px #fff; }
    .floating-gem { position: fixed; z-index: 1; pointer-events: none; animation: floaty linear infinite; filter: drop-shadow(0 0 8px rgba(255,255,255,0.6)); opacity: 0.4; }
    .floating-gem img { width: 100%; height: 100%; object-fit: contain; }

    /* ============ ESCENARIO ============ */
    #scene-container { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
    .scene-element { position: absolute; filter: drop-shadow(0 10px 15px rgba(60,20,90,0.5)); }
    #stage-emir { left: -15px; bottom: 12vh; width: 95px; animation: floaty 4s infinite ease-in-out; }
    #stage-steven { right: -15px; bottom: 12vh; width: 110px; animation: floatyReverse 5s infinite ease-in-out; transform: scaleX(-1); }

    /* ============ TARJETA ============ */
    #invitation-card {
      position: relative; width: 100%; max-width: 400px; z-index: 10;
      background: linear-gradient(165deg, #f5e8ff 0%, #ede0ff 25%, #fce4ec 60%, #e8d5ff 100%);
      border: 14px solid transparent;
      border-image: linear-gradient(135deg, #c9a7f5 0%, #e0c4ff 25%, #d4b3ff 50%, #e0c4ff 75%, #c9a7f5 100%) 1;
      border-radius: 32px;
      box-shadow: 0 0 30px rgba(180, 150, 255, 0.6), inset 0 0 40px rgba(255, 255, 255, 0.5), 0 20px 50px rgba(0,0,0,0.5);
      padding: 25px 20px 30px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
      animation: enterFromBottom 0.8s ease-out forwards, frameGlow 4s ease-in-out infinite;
      overflow: hidden;
    }
    #invitation-card::before {
      content: ''; position: absolute; inset: 6px;
      border: 2px solid rgba(255, 255, 255, 0.7); border-radius: 22px;
      pointer-events: none; z-index: 1;
    }
    
    #sword-on-card {
      position: absolute;
      right: 8px;
      top: 42%;
      width: 60px;
      height: auto;
      z-index: 3;
      pointer-events: none;
      transform: translateY(-50%) rotate(90deg);
      transform-origin: center;
      animation: swordSwingVertical 4s ease-in-out infinite;
      filter: drop-shadow(0 4px 8px rgba(60,20,90,0.4));
      opacity: 0.85;
    }
    
    #stage-shield-bg {
      position: absolute; top: 50%; left: 50%; width: 90%; max-width: 340px;
      transform: translate(-50%, -50%); opacity: 0.28; z-index: 0; pointer-events: none;
      animation: spinShield 40s linear infinite;
      filter: drop-shadow(0 0 20px rgba(255,105,180,0.5));
    }
    .card-content { position: relative; z-index: 2; width: 100%; display: flex; flex-direction: column; align-items: center; }
    #notificacion-previo {
      width: 100%; padding: 12px; border-radius: 12px; margin-bottom: 15px;
      background: #e3f2fd; color: #1565c0; border: 2px solid #90caf9;
      font-size: 0.85rem; font-weight: 700; line-height: 1.4; text-align: center;
    }
    .location-banner {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0);
      border-radius: 15px; padding: 10px 15px; margin-bottom: 20px;
      border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .location-banner span { font-family: 'Fredoka One', cursive; color: #c2185b; font-size: 0.95rem; }
    .location-banner a {
      background: #ec4899; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 10px;
      font-family: 'Fredoka One', cursive; font-size: 0.8rem; box-shadow: 0 3px 0 #880e4f;
    }
    .main-title {
      font-family: 'Fredoka One', cursive; line-height: 1.1; margin: 0 0 5px;
      font-size: 2.2rem; color: #fff; -webkit-text-stroke: 2px #7b4fd0;
      text-shadow: 0 4px 0 #7b4fd0, 0 8px 15px rgba(80,30,140,0.3);
    }
    .main-title .num { color: #ffd6ea; }
    .subtitle { font-family: 'Fredoka One', cursive; font-size: 1rem; color: #5e35b1; margin: 0 0 20px; letter-spacing: 1px; }
    .emir-photo-container {
      width: 110px; height: 110px; border-radius: 50%; border: 4px solid #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2); overflow: hidden; margin-bottom: 20px;
      background: #fce4ec; display: flex; justify-content: center; align-items: center;
      position: relative; z-index: 5;
    }
    .emir-photo-container img { width: 100%; height: 100%; object-fit: cover; }
    .form-group { width: 100%; margin-bottom: 15px; text-align: left; }
    .form-label { font-family: 'Fredoka One', cursive; color: #4a2b86; font-size: 0.95rem; margin-bottom: 6px; display: block; }
    .form-input {
      width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid #d1c4e9;
      background: rgba(255,255,255,0.8); font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 700; color: #4a2b86;
      outline: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
    }
    .form-input:focus { border-color: #ec4899; background: #fff; }
    .counters-wrapper { display: flex; gap: 15px; width: 100%; margin-bottom: 15px; }
    .counter-box {
      flex: 1; background: #fce4ec; border-radius: 15px; padding: 10px;
      border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      display: flex; flex-direction: column; align-items: center;
    }
    .counter-label { font-family: 'Fredoka One', cursive; color: #c2185b; font-size: 0.8rem; margin-bottom: 6px; }
    .counter-controls { display: flex; align-items: center; gap: 10px; }
    .counter-btn {
      background: #ec4899; color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%;
      font-size: 1rem; font-weight: bold; display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: 0 3px 0 #880e4f;
    }
    .counter-btn:active { transform: translateY(3px); box-shadow: none; }
    .counter-val { font-family: 'Fredoka One', cursive; font-size: 1.3rem; color: #4a2b86; width: 25px; text-align: center; }
    .gems-row { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; width: 100%; margin-bottom: 20px; }
    .gem-dot { width: 22px; height: 22px; cursor: pointer; transition: transform 0.2s, filter 0.2s; }
    .gem-dot img { width: 100%; height: 100%; object-fit: contain; }
    .gem-dot.lit-adult { transform: scale(1.2); filter: hue-rotate(180deg) saturate(1.8) drop-shadow(0 0 6px #64b5f6); }
    .gem-dot.lit-kid { transform: scale(1.2); filter: hue-rotate(0deg) saturate(1.8) drop-shadow(0 0 6px #ff80ab); }
    .gem-dot.unlit { opacity: 0.4; filter: grayscale(0.8); }
    .selection-title { font-family: 'Fredoka One', cursive; color: #4a2b86; font-size: 1rem; margin-bottom: 10px; text-align: center; width: 100%; }
    .selection-row { display: flex; justify-content: center; gap: 25px; width: 100%; margin-bottom: 20px; }
    .selectable-gem { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.3s; position: relative; }
    .selectable-gem img { width: 80px; height: 80px; object-fit: contain; transition: all 0.3s ease; filter: grayscale(0.7) brightness(0.7); opacity: 0.6; }
    .selectable-gem span { font-family: 'Fredoka One', cursive; font-size: 0.85rem; margin-top: 5px; color: #4a2b86; opacity: 0.6; transition: all 0.3s; }
    .selectable-gem.yes.selected img { animation: selectedGlowYes 1.5s infinite ease-in-out; filter: none; opacity: 1; }
    .selectable-gem.no.selected img { animation: selectedGlowNo 1.5s infinite ease-in-out; filter: hue-rotate(220deg) saturate(1.5) brightness(0.9); opacity: 1; }
    .selectable-gem.selected span { opacity: 1; font-size: 1rem; color: #ec4899; }
    .selectable-gem.no.selected span { color: #7e57c2; }
    .selectable-gem:active { transform: scale(0.95); }
    .selectable-gem.selected::after {
      content: '✓'; position: absolute; font-size: 1.5rem; color: #fff; background: #ec4899;
      width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
      top: -5px; right: -5px; box-shadow: 0 3px 10px rgba(0,0,0,0.3); animation: popGem 0.3s ease-out;
    }
    .selectable-gem.no.selected::after { background: #7e57c2; }

    /* ============ GEMA DEL PORTAL ============ */
    .portal-section {
      position: relative; margin-top: 20px;
      display: flex; justify-content: center; align-items: center;
      width: 260px; height: 260px;
      cursor: pointer; transition: transform 0.3s;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .portal-section.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    
    .portal-ring-outer {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      border: 4px dashed rgba(255, 105, 180, 0.8);
      box-shadow: 0 0 50px rgba(255, 105, 180, 0.6), inset 0 0 50px rgba(139, 92, 246, 0.6);
      animation: spinPortal 12s linear infinite; pointer-events: none;
      transition: animation-duration 0.3s;
    }
    .portal-ring-inner {
      position: absolute; width: 82%; height: 82%; border-radius: 50%;
      border: 3px dotted rgba(255, 235, 59, 0.9);
      animation: spinPortalReverse 8s linear infinite; pointer-events: none;
      transition: animation-duration 0.3s;
    }
    
    .portal-energy-ring {
      position: absolute; width: 92%; height: 92%; border-radius: 50%;
      border: 3px solid transparent;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .portal-energy-ring.active {
      opacity: 1;
      animation: energyRingPulse 0.5s infinite;
    }

    #charge-ring {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      transform: rotate(-90deg);
      pointer-events: none; z-index: 4;
    }
    #charge-ring circle {
      fill: none; stroke: #ffeb3b; stroke-width: 8; stroke-linecap: round;
      stroke-dasharray: 754; stroke-dashoffset: 754;
      filter: drop-shadow(0 0 10px #ffeb3b) drop-shadow(0 0 20px #ff69b4);
      transition: stroke-dashoffset 0.05s linear, stroke 0.3s;
    }

    #portal-gem {
      width: 200px; height: 200px; object-fit: contain; z-index: 2;
      animation: portalPulse 2s infinite ease-in-out;
      position: relative;
    }
    #portal-gem.charging { animation: gemCharging 0.5s infinite ease-in-out; }

    .electric-spark {
      position: absolute;
      top: 50%; left: 50%;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px #fff, 0 0 24px #ffeb3b, 0 0 36px #ffeb3b;
      pointer-events: none;
      z-index: 6;
      animation: staticSpark 0.8s ease-out forwards;
    }
    .electric-spark.purple {
      background: #e1bee7;
      box-shadow: 0 0 12px #fff, 0 0 24px #b39ddb, 0 0 36px #7e57c2;
    }

    .lightning-line {
      position: absolute;
      top: 50%; left: 50%;
      width: 4px;
      height: 80px;
      background: linear-gradient(180deg, #fff 0%, #ffeb3b 30%, #ffeb3b 70%, transparent 100%);
      transform-origin: top center;
      pointer-events: none;
      z-index: 6;
      filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px #ffeb3b) drop-shadow(0 0 30px #ffeb3b);
      clip-path: polygon(40% 0%, 60% 0%, 40% 25%, 70% 25%, 30% 50%, 60% 50%, 20% 75%, 50% 75%, 40% 100%, 60% 100%, 40% 75%, 70% 75%, 30% 50%, 60% 50%, 20% 25%, 50% 25%);
      animation: electricDischarge 0.5s ease-out forwards;
    }
    .lightning-line.purple {
      background: linear-gradient(180deg, #fff 0%, #b39ddb 30%, #b39ddb 70%, transparent 100%);
      filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 20px #b39ddb) drop-shadow(0 0 30px #7e57c2);
    }

    .portal-hint {
      position: absolute; bottom: -15px;
      font-family: 'Fredoka One', cursive; font-size: 0.85rem; color: #fff;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      padding: 8px 18px; border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      animation: floaty 2s infinite ease-in-out;
      z-index: 7; pointer-events: none; text-align: center; white-space: nowrap;
    }

    .portal-sparkle {
      position: absolute; font-size: 26px; color: #fff;
      text-shadow: 0 0 10px #fff, 0 0 20px #ff69b4, 0 0 30px #ffeb3b;
      pointer-events: none; z-index: 3;
      animation: starTwinkle 1.5s infinite ease-in-out;
    }
    .portal-sparkle:nth-child(1) { top: 0px; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
    .portal-sparkle:nth-child(2) { top: 25%; right: 0px; animation-delay: 0.3s; }
    .portal-sparkle:nth-child(3) { bottom: 0px; left: 50%; transform: translateX(-50%); animation-delay: 0.6s; }
    .portal-sparkle:nth-child(4) { top: 25%; left: 0px; animation-delay: 0.9s; }
    .portal-sparkle:nth-child(5) { top: 5%; right: 20%; animation-delay: 1.2s; }
    .portal-sparkle:nth-child(6) { bottom: 15%; right: 10%; animation-delay: 0.4s; }
    .portal-sparkle:nth-child(7) { bottom: 15%; left: 10%; animation-delay: 0.8s; }
    .portal-sparkle:nth-child(8) { top: 15%; left: 10%; animation-delay: 1.5s; }

    #mensaje-final { margin-top: 20px; padding: 20px; border-radius: 15px; font-weight: 800; font-size: 1.1rem; width: 100%; text-align: center; }
    .hidden { display: none !important; }

    /* ============ OVERLAYS ============ */
    #portal-open-overlay {
      position: fixed; inset: 0; z-index: 2000; pointer-events: none;
      background: radial-gradient(circle, rgba(255,235,59,0.4) 0%, rgba(255,105,180,0.3) 40%, transparent 70%);
      opacity: 0; transition: opacity 0.5s;
    }
    #portal-open-overlay.active { opacity: 1; }
    .portal-creation-ring {
      position: fixed; top: 50%; left: 50%;
      width: 300px; height: 300px; border-radius: 50%;
      border: 15px solid #ffeb3b;
      box-shadow: 0 0 60px #ffeb3b, inset 0 0 60px #ff69b4;
      pointer-events: none; z-index: 2001;
      animation: ringExpand 2s ease-out forwards;
    }

    #screen-crack-overlay {
      position: fixed; inset: 0; z-index: 1999; pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at center, rgba(126,87,194,0.5) 0%, rgba(69,39,160,0.4) 40%, rgba(20,10,40,0.6) 100%);
    }
    #screen-crack-overlay.active { animation: screenCrack 1s forwards ease-out; }
    
    #crack-svg {
      position: fixed; inset: 0; z-index: 2000; pointer-events: none;
      opacity: 0; transition: opacity 0.3s;
    }
    #crack-svg.active { opacity: 1; }
    .crack-line {
      stroke: #fff; stroke-width: 2; fill: none;
      filter: drop-shadow(0 0 5px #fff) drop-shadow(0 0 10px #b39ddb);
      stroke-dasharray: 1000; stroke-dashoffset: 1000;
    }
    .crack-line.active { animation: crackDraw 1.5s ease-out forwards; }

    .gem-half {
      position: fixed;
      width: 200px; height: 200px;
      object-fit: contain;
      z-index: 2001;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      filter: drop-shadow(0 0 20px #b39ddb) drop-shadow(0 0 40px #7e57c2) brightness(1.5);
    }
    .gem-half.left { 
      clip-path: polygon(
        0% 0%, 45% 0%, 48% 8%, 52% 16%, 47% 24%, 53% 32%, 48% 40%, 54% 48%,
        48% 56%, 53% 64%, 47% 72%, 52% 80%, 47% 88%, 52% 96%, 48% 100%, 0% 100%
      ); 
    }
    .gem-half.right { 
      clip-path: polygon(
        45% 0%, 100% 0%, 100% 100%, 48% 100%, 52% 96%, 47% 88%, 52% 80%, 47% 72%,
        53% 64%, 48% 56%, 54% 48%, 48% 40%, 53% 32%, 47% 24%, 52% 16%, 48% 8%
      ); 
    }
    .gem-half.left.break { animation: gemSplitLeftZigzag 4s cubic-bezier(0.4, 0, 0.7, 1) forwards; }
    .gem-half.right.break { animation: gemSplitRightZigzag 4s cubic-bezier(0.4, 0, 0.7, 1) forwards; }

    .shockwave-ring {
      position: fixed; top: 50%; left: 50%;
      width: 200px; height: 200px; border-radius: 50%;
      border: 20px solid #fff;
      pointer-events: none; z-index: 2001;
      animation: shockwave 1.5s ease-out forwards;
    }

    .sparkle-star {
      position: fixed; font-size: 40px; z-index: 3001; pointer-events: none;
      animation: sparkleFly 2s ease-out forwards;
      filter: drop-shadow(0 0 10px #fff);
    }

    .gem-shard {
      position: fixed; z-index: 2001; pointer-events: none;
      filter: drop-shadow(0 0 10px #b39ddb) drop-shadow(0 0 20px #7e57c2);
      animation: shardFall 4s cubic-bezier(0.4, 0, 0.7, 1) forwards;
    }
    .gem-shard img { width: 100%; height: 100%; object-fit: contain; }

    .energy-particle {
      position: fixed; width: 8px; height: 8px; border-radius: 50%;
      background: #ffeb3b;
      box-shadow: 0 0 15px #ffeb3b, 0 0 30px #ff69b4;
      pointer-events: none; z-index: 1500;
      animation: particleAbsorb 0.8s ease-in forwards;
    }
    .energy-particle.purple { background: #b39ddb; box-shadow: 0 0 15px #b39ddb, 0 0 30px #7e57c2; }

    .footer-text { margin-top: 15px; font-size: 0.8rem; color: #9575cd; font-weight: 700; letter-spacing: 0.5px; }
  </style>
</head>
<body>

  <audio id="bg-music" loop>
    <source src="./musica/cancion.mp3" type="audio/mpeg">
  </audio>

  <div id="portal-open-overlay"></div>
  <div id="screen-crack-overlay"></div>
  <svg id="crack-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>

  <div id="start-overlay">
    <h1 class="start-title">¡Cumpleaños 10 de Emir!</h1>
    <p class="start-sub">UNA MISIÓN DE CRISTAL</p>
    <img src="./imagenes/gema.png" class="gem-start-img" alt="Gema">
    <button onclick="startExperience()" class="btn-start">Abrir Invitación</button>
  </div>

  <div id="stars-container"></div>
  <div id="floating-gems-container"></div>

  <div id="scene-container">
    <img id="stage-emir" class="scene-element" src="./imagenes/emir.png" alt="Emir">
    <img id="stage-steven" class="scene-element" src="./imagenes/steven_escudo.png" alt="Steven con Escudo">
  </div>

  <div id="invitation-card" style="display:none;">
    <img src="./imagenes/escudo.png" id="stage-shield-bg" alt="Escudo">
    <img src="./imagenes/espada.png" id="sword-on-card" alt="Espada">
    
    <div class="card-content">
      <div id="notificacion-previo" class="hidden"></div>

      <div class="location-banner">
        <span>🏠 Casa de Emir</span>
        <a id="map-link" href="#" target="_blank">Ver Mapa</a>
      </div>

      <h1 class="main-title">¡CUMPLEAÑOS<br><span class="num">10</span> DE EMIR!</h1>
      <p class="subtitle">¡UNA MISIÓN DE CRISTAL!</p>

      <div class="emir-photo-container anim-float">
        <img src="./imagenes/emir.png" alt="Emir">
      </div>

      <div id="form-section" style="width:100%;">
        <div class="form-group">
          <label class="form-label">Tu Nombre Estelar (como Gema):</label>
          <input type="text" id="nombre" class="form-input" placeholder="Ej. Granate, Perla...">
        </div>

        <div class="form-group">
          <label class="form-label">Acompañantes:</label>
          <div class="counters-wrapper">
            <div class="counter-box">
              <span class="counter-label">Adultos</span>
              <div class="counter-controls">
                <button class="counter-btn" onclick="updateCount('adultos', -1)">−</button>
                <span id="count-adultos" class="counter-val">0</span>
                <button class="counter-btn" onclick="updateCount('adultos', 1)">+</button>
              </div>
            </div>
            <div class="counter-box">
              <span class="counter-label">Niños</span>
              <div class="counter-controls">
                <button class="counter-btn" onclick="updateCount('ninos', -1)">−</button>
                <span id="count-ninos" class="counter-val">0</span>
                <button class="counter-btn" onclick="updateCount('ninos', 1)">+</button>
              </div>
            </div>
          </div>
          <div class="gems-row" id="gems-row"></div>
        </div>

        <div class="selection-title">Selecciona tu gema:</div>
        <div class="selection-row">
          <div class="selectable-gem yes" id="gem-yes" onclick="seleccionarGema('si')">
            <img src="./imagenes/gema.png" alt="Sí">
            <span>¡Sí asistiré!</span>
          </div>
          <div class="selectable-gem no" id="gem-no" onclick="seleccionarGema('no')">
            <img src="./imagenes/gema.png" alt="No">
            <span>No podré ir</span>
          </div>
        </div>
      </div>

      <div id="mensaje-final" class="hidden"></div>
      
      <div class="portal-section" id="portal-section">
        <div class="portal-ring-outer" id="ring-outer"></div>
        <div class="portal-ring-inner" id="ring-inner"></div>
        <div class="portal-energy-ring" id="energy-ring"></div>
        
        <svg id="charge-ring" viewBox="0 0 260 260">
          <circle cx="130" cy="130" r="120"></circle>
        </svg>
        
        <div class="portal-sparkle">✦</div>
        <div class="portal-sparkle">✦</div>
        <div class="portal-sparkle">✦</div>
        <div class="portal-sparkle">✦</div>
        <div class="portal-sparkle">✦</div>
        <div class="portal-sparkle">✦</div>
        <div class="portal-sparkle">✦</div>
        <div class="portal-sparkle">✦</div>
        
        <img src="./imagenes/gema_portal.png" id="portal-gem" alt="Portal">
        <div class="portal-hint" id="portal-hint">👆 Mantén presionada la gema para cargar</div>
      </div>
      
      <div class="footer-text">Te esperamos para vivir esta aventura juntos</div>
    </div>
  </div>

  <script>
    const CONFIG = {
      urlAppsScript: "https://script.google.com/macros/s/AKfycbwvQWiIuFLeLDFOFhyaMEJN9VqK8rq0o3Ljvf95KrETzr1dzVO1dUV0RkxeeorB26tR/exec",
      lat: 17.2220381,
      lng: -96.8204176,
      maxGemas: 10,
      chargeTime: 2500
    };

    let adultos = 0;
    let ninos = 0;
    let seleccion = null;
    let animacionEnCurso = false;
    let chargeProgress = 0;
    let chargeInterval = null;
    let isCharging = false;
    let electricInterval = null;

    window.addEventListener('load', () => {
      document.getElementById('map-link').href =
        'https://www.google.com/maps/search/?api=1&query=' + CONFIG.lat + ',' + CONFIG.lng;
      
      spawnStars();
      spawnFloatingGems();
      buildGemDots();
      cargarDatosGuardados();
      initChargeListeners();
    });

    function spawnStars() {
      const container = document.getElementById('stars-container');
      for (let i = 0; i < 30; i++) {
        const s = document.createElement('div');
        s.className = 'sky-star'; s.textContent = '✦';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.top = Math.random() * 100 + 'vh';
        s.style.fontSize = (6 + Math.random() * 12) + 'px';
        s.style.animationDelay = (Math.random() * 3) + 's';
        s.style.opacity = Math.random() * 0.7 + 0.3;
        container.appendChild(s);
      }
    }

    function spawnFloatingGems() {
      const container = document.getElementById('floating-gems-container');
      for (let i = 0; i < 8; i++) {
        const gem = document.createElement('div');
        gem.className = 'floating-gem';
        gem.innerHTML = '<img src="./imagenes/gema.png" alt="Gema">';
        gem.style.left = Math.random() * 90 + 'vw';
        gem.style.top = Math.random() * 90 + 'vh';
        gem.style.width = (15 + Math.random() * 20) + 'px';
        gem.style.height = gem.style.width;
        gem.style.animationDuration = (12 + Math.random() * 10) + 's';
        gem.style.animationDelay = (-Math.random() * 20) + 's';
        container.appendChild(gem);
      }
    }

    function buildGemDots() {
      const wrap = document.getElementById('gems-row');
      wrap.innerHTML = '';
      for (let i = 1; i <= CONFIG.maxGemas; i++) {
        const d = document.createElement('div');
        d.className = 'gem-dot unlit';
        d.innerHTML = '<img src="./imagenes/gema.png" alt="Gema">';
        d.onclick = () => {
          const totalActual = adultos + ninos;
          if (i > totalActual) {
            updateCount('ninos', i - totalActual);
          } else if (i < totalActual) {
            let aRestar = totalActual - i;
            let restarNinos = Math.min(ninos, aRestar);
            updateCount('ninos', -restarNinos);
            aRestar -= restarNinos;
            if (aRestar > 0) updateCount('adultos', -aRestar);
          }
        };
        wrap.appendChild(d);
      }
      actualizarGemas();
    }

    function updateCount(tipo, cambio) {
      if (tipo === 'adultos') {
        if (cambio > 0 && (adultos + ninos) >= CONFIG.maxGemas) return;
        adultos = Math.max(0, adultos + cambio);
        document.getElementById('count-adultos').innerText = adultos;
      } else {
        if (cambio > 0 && (adultos + ninos) >= CONFIG.maxGemas) return;
        ninos = Math.max(0, ninos + cambio);
        document.getElementById('count-ninos').innerText = ninos;
      }
      actualizarGemas();
    }

    function actualizarGemas() {
      const total = adultos + ninos;
      const gems = document.querySelectorAll('.gem-dot');
      gems.forEach((gem, index) => {
        gem.className = 'gem-dot';
        if (index < adultos) gem.classList.add('lit-adult');
        else if (index < total) gem.classList.add('lit-kid');
        else gem.classList.add('unlit');
      });
    }

    function seleccionarGema(tipo) {
      if (animacionEnCurso) return;
      seleccion = tipo;
      document.getElementById('gem-yes').classList.remove('selected');
      document.getElementById('gem-no').classList.remove('selected');
      if (tipo === 'si') {
        document.getElementById('gem-yes').classList.add('selected');
      } else {
        document.getElementById('gem-no').classList.add('selected');
      }
    }

    function initChargeListeners() {
      const portal = document.getElementById('portal-section');
      portal.addEventListener('mousedown', startCharging);
      portal.addEventListener('mouseup', stopCharging);
      portal.addEventListener('mouseleave', stopCharging);
      portal.addEventListener('touchstart', (e) => { e.preventDefault(); startCharging(); }, { passive: false });
      portal.addEventListener('touchend', (e) => { e.preventDefault(); stopCharging(); }, { passive: false });
      portal.addEventListener('touchcancel', stopCharging);
    }

    function createElectricSpark() {
      const portal = document.getElementById('portal-section');
      const isPurple = seleccion === 'no';
      
      const spark = document.createElement('div');
      spark.className = 'electric-spark' + (isPurple ? ' purple' : '');
      
      const angle = Math.random() * Math.PI * 2;
      const radius = 80 + Math.random() * 60;
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      
      spark.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      
      portal.appendChild(spark);
      setTimeout(() => spark.remove(), 800);
      
      if (Math.random() < 0.6) {
        const bolt = document.createElement('div');
        bolt.className = 'lightning-line' + (isPurple ? ' purple' : '');
        bolt.style.setProperty('--angle', (angle * 180 / Math.PI) + 'deg');
        bolt.style.transform = `translate(-50%, -50%) rotate(${angle * 180 / Math.PI}deg)`;
        bolt.style.height = (60 + Math.random() * 60) + 'px';
        portal.appendChild(bolt);
        setTimeout(() => bolt.remove(), 500);
      }
    }

    function startCharging() {
      if (animacionEnCurso || isCharging) return;
      
      const nombre = document.getElementById('nombre').value.trim();
      if (!nombre) { alert('Por favor, ingresa tu nombre estelar.'); return; }
      
      if (!seleccion) { 
        alert('Por favor, selecciona una gema (¡Sí asistiré! o No podré ir).'); 
        return; 
      }
      
      // ✅ VALIDACIONES SOLO SI VA A ASISTIR
      if (seleccion === 'si') {
        const total = adultos + ninos;
        
        if (total === 0) {
          alert('⚠️ Si vas a asistir, debes indicar al menos 1 persona.\nUsa los botones + para seleccionar cuántos adultos y niños van.');
          return;
        }
        
        if (ninos > 0 && adultos === 0) {
          alert('⚠️ Los niños no pueden ir solos.\nDebes agregar al menos 1 adulto que los acompañe.');
          return;
        }
      }
      // ✅ Si elige "No podré ir", NO se valida nada de acompañantes.
      
      isCharging = true;
      chargeProgress = 0;
      
      const portalGem = document.getElementById('portal-gem');
      const hint = document.getElementById('portal-hint');
      const chargeRing = document.querySelector('#charge-ring circle');
      const ringOuter = document.getElementById('ring-outer');
      const ringInner = document.getElementById('ring-inner');
      const energyRing = document.getElementById('energy-ring');
      
      portalGem.classList.add('charging');
      energyRing.classList.add('active');
      
      hint.innerHTML = '⚡ ¡Sigue presionando!';
      hint.style.background = seleccion === 'si' 
        ? 'linear-gradient(135deg, #ffeb3b, #ff69b4)' 
        : 'linear-gradient(135deg, #b39ddb, #7e57c2)';
      
      chargeRing.style.stroke = seleccion === 'si' ? '#ffeb3b' : '#b39ddb';
      
      const updateInterval = 50;
      const increment = 100 / (CONFIG.chargeTime / updateInterval);
      
      electricInterval = setInterval(() => {
        const rate = 0.3 + (chargeProgress / 100) * 0.7;
        if (Math.random() < rate) {
          createElectricSpark();
          if (Math.random() < 0.4) setTimeout(createElectricSpark, 30);
        }
      }, 80);
      
      chargeInterval = setInterval(() => {
        chargeProgress += increment;
        
        const offset = 754 - (754 * chargeProgress / 100);
        chargeRing.style.strokeDashoffset = offset;
        
        const speedFactor = chargeProgress / 100;
        const outerDuration = 12 - (speedFactor * 10);
        const innerDuration = 8 - (speedFactor * 6.5);
        ringOuter.style.animationDuration = outerDuration + 's';
        ringInner.style.animationDuration = innerDuration + 's';
        
        if (Math.random() < 0.5) {
          const particle = document.createElement('div');
          particle.className = 'energy-particle' + (seleccion === 'no' ? ' purple' : '');
          
          const angle = Math.random() * Math.PI * 2;
          const distance = 150 + Math.random() * 100;
          const startX = Math.cos(angle) * distance;
          const startY = Math.sin(angle) * distance;
          
          const portalRect = document.getElementById('portal-section').getBoundingClientRect();
          const centerX = portalRect.left + portalRect.width / 2;
          const centerY = portalRect.top + portalRect.height / 2;
          
          particle.style.left = (centerX + startX) + 'px';
          particle.style.top = (centerY + startY) + 'px';
          particle.style.setProperty('--start-x', startX + 'px');
          particle.style.setProperty('--start-y', startY + 'px');
          
          document.body.appendChild(particle);
          setTimeout(() => particle.remove(), 800);
        }
        
        if ('vibrate' in navigator) {
          const intensity = Math.floor(5 + (chargeProgress / 100) * 30);
          if (Math.random() < 0.4) navigator.vibrate(intensity);
        }
        
        if (chargeProgress >= 100) {
          clearInterval(chargeInterval);
          clearInterval(electricInterval);
          chargeInterval = null;
          electricInterval = null;
          isCharging = false;
          executeConfirmacion();
        }
      }, updateInterval);
    }

    function stopCharging() {
      if (!isCharging) return;
      isCharging = false;
      
      if (chargeInterval) { clearInterval(chargeInterval); chargeInterval = null; }
      if (electricInterval) { clearInterval(electricInterval); electricInterval = null; }
      
      chargeProgress = 0;
      const portalGem = document.getElementById('portal-gem');
      const hint = document.getElementById('portal-hint');
      const chargeRing = document.querySelector('#charge-ring circle');
      const ringOuter = document.getElementById('ring-outer');
      const ringInner = document.getElementById('ring-inner');
      const energyRing = document.getElementById('energy-ring');
      
      portalGem.classList.remove('charging');
      energyRing.classList.remove('active');
      chargeRing.style.strokeDashoffset = 754;
      ringOuter.style.animationDuration = '12s';
      ringInner.style.animationDuration = '8s';
      hint.innerHTML = '👆 Mantén presionada la gema para cargar';
      hint.style.background = 'linear-gradient(135deg, #ec4899, #8b5cf6)';
    }

    function executeConfirmacion() {
      if (animacionEnCurso) return;
      animacionEnCurso = true;
      
      const nombre = document.getElementById('nombre').value.trim() || "Sin nombre";
      const adultosNum = Math.max(0, parseInt(adultos, 10) || 0);
      const ninosNum = Math.max(0, parseInt(ninos, 10) || 0);
      const asistira = seleccion === 'si';

      const datosAGuardar = { 
        nombre: nombre, 
        adultos: adultosNum, 
        ninos: ninosNum, 
        asistira: asistira ? 'Sí' : 'No' 
      };
      localStorage.setItem('invitacionEmir', JSON.stringify(datosAGuardar));

      document.getElementById('form-section').classList.add('hidden');
      document.getElementById('portal-hint').style.display = 'none';

      if (CONFIG.urlAppsScript && CONFIG.urlAppsScript !== 'TU_URL_DE_APPS_SCRIPT_AQUI') {
        const datos = { 
          nombre: nombre, 
          adultos: adultosNum, 
          ninos: ninosNum, 
          asistira: asistira ? 'Sí' : 'No' 
        };
        fetch(CONFIG.urlAppsScript, { 
          method: 'POST', mode: 'no-cors', 
          headers: { 'Content-Type': 'text/plain' }, 
          body: JSON.stringify(datos) 
        })
        .then(() => console.log('✅ Datos enviados:', datos))
        .catch(err => console.error('❌ Error:', err));
      }

      if (asistira) {
        animacionPortalCreacion();
      } else {
        animacionRoturaGema();
      }
    }

    function animacionPortalCreacion() {
      const overlay = document.getElementById('portal-open-overlay');
      overlay.classList.add('active');
      
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          const ring = document.createElement('div');
          ring.className = 'portal-creation-ring';
          document.body.appendChild(ring);
          setTimeout(() => ring.remove(), 2000);
        }, i * 300);
      }
      
      const estrellas = ['✨', '⭐', '💫', '🌟', '💖', '💎', '🌈'];
      for (let i = 0; i < 60; i++) {
        setTimeout(() => {
          const star = document.createElement('div');
          star.className = 'sparkle-star';
          star.textContent = estrellas[Math.floor(Math.random() * estrellas.length)];
          star.style.left = Math.random() * 100 + 'vw';
          star.style.top = Math.random() * 100 + 'vh';
          star.style.fontSize = (30 + Math.random() * 60) + 'px';
          star.style.setProperty('--tx', (Math.random() - 0.5) * 600 + 'px');
          star.style.setProperty('--ty', (Math.random() - 0.5) * 600 + 'px');
          star.style.animationDuration = (1.2 + Math.random() * 1.5) + 's';
          document.body.appendChild(star);
          setTimeout(() => star.remove(), 2700);
        }, i * 25);
      }
      
      if ('vibrate' in navigator) navigator.vibrate([100, 50, 100, 50, 200]);
      
      setTimeout(() => {
        overlay.classList.remove('active');
        mostrarPantallaCierre('Éxito');
      }, 3500);
    }

    function animacionRoturaGema() {
      const crackOverlay = document.getElementById('screen-crack-overlay');
      crackOverlay.classList.add('active');
      
      crearGrietasPantalla();
      
      const originalGem = document.getElementById('portal-gem');
      originalGem.style.opacity = '0';
      
      const leftHalf = document.createElement('img');
      leftHalf.src = './imagenes/gema_portal.png';
      leftHalf.className = 'gem-half left';
      
      const rightHalf = document.createElement('img');
      rightHalf.src = './imagenes/gema_portal.png';
      rightHalf.className = 'gem-half right';
      
      document.body.appendChild(leftHalf);
      document.body.appendChild(rightHalf);
      
      if ('vibrate' in navigator) navigator.vibrate([300, 100, 400]);
      
      setTimeout(() => {
        const shockwave = document.createElement('div');
        shockwave.className = 'shockwave-ring';
        document.body.appendChild(shockwave);
        setTimeout(() => shockwave.remove(), 1500);
      }, 600);
      
      setTimeout(() => {
        leftHalf.classList.add('break');
        rightHalf.classList.add('break');
      }, 1200);
      
      setTimeout(() => {
        const clipPaths = [
          'polygon(0% 0%, 50% 0%, 50% 50%, 0% 50%)',
          'polygon(50% 0%, 100% 0%, 100% 50%, 50% 50%)',
          'polygon(0% 50%, 50% 50%, 50% 100%, 0% 100%)',
          'polygon(50% 50%, 100% 50%, 100% 100%, 50% 100%)',
          'polygon(25% 25%, 75% 25%, 75% 75%, 25% 75%)'
        ];
        
        for (let i = 0; i < 50; i++) {
          setTimeout(() => {
            const shard = document.createElement('div');
            shard.className = 'gem-shard';
            shard.style.left = '50vw';
            shard.style.top = '50vh';
            
            const size = 30 + Math.random() * 60;
            shard.style.width = size + 'px';
            shard.style.height = size + 'px';
            
            const img = document.createElement('img');
            img.src = './imagenes/gema_portal.png';
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'contain';
            img.style.clipPath = clipPaths[Math.floor(Math.random() * clipPaths.length)];
            shard.appendChild(img);
            
            const tx = (Math.random() - 0.5) * 300;
            const rot = (Math.random() - 0.5) * 1080;
            
            shard.style.setProperty('--tx', tx + 'px');
            shard.style.setProperty('--ty', '100vh');
            shard.style.setProperty('--rot', rot + 'deg');
            shard.style.animationDuration = (2.5 + Math.random() * 1.5) + 's';
            
            document.body.appendChild(shard);
            setTimeout(() => shard.remove(), 4500);
          }, i * 40);
        }
      }, 1200);
      
      for (let i = 0; i < 40; i++) {
        setTimeout(() => {
          const star = document.createElement('div');
          star.className = 'sparkle-star';
          star.textContent = ['💔', '🔮', '💫', '✦', '✨'][Math.floor(Math.random() * 5)];
          star.style.left = Math.random() * 100 + 'vw';
          star.style.top = Math.random() * 100 + 'vh';
          star.style.fontSize = (25 + Math.random() * 40) + 'px';
          star.style.setProperty('--tx', (Math.random() - 0.5) * 400 + 'px');
          star.style.setProperty('--ty', (Math.random() - 0.3) * 400 + 'px');
          star.style.animationDuration = (2 + Math.random() * 1.5) + 's';
          star.style.filter = 'hue-rotate(220deg)';
          document.body.appendChild(star);
          setTimeout(() => star.remove(), 3500);
        }, i * 50);
      }
      
      setTimeout(() => {
        crackOverlay.classList.remove('active');
        document.getElementById('crack-svg').classList.remove('active');
        mostrarPantallaCierre('Rechazo');
      }, 5500);
    }

    function crearGrietasPantalla() {
      const svg = document.getElementById('crack-svg');
      svg.innerHTML = '';
      svg.classList.add('active');
      
      const cx = 50;
      const cy = 50;
      
      for (let i = 0; i < 12; i++) {
        const angle = (i * 30) + (Math.random() * 15 - 7.5);
        const rad = angle * Math.PI / 180;
        const length = 35 + Math.random() * 30;
        const x2 = cx + Math.cos(rad) * length;
        const y2 = cy + Math.sin(rad) * length;
        
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const mx = cx + Math.cos(rad) * (length * 0.5) + (Math.random() - 0.5) * 8;
        const my = cy + Math.sin(rad) * (length * 0.5) + (Math.random() - 0.5) * 8;
        
        line.setAttribute('d', `M ${cx} ${cy} L ${mx} ${my} L ${x2} ${y2}`);
        line.setAttribute('class', 'crack-line');
        line.setAttribute('stroke-width', '0.3');
        line.setAttribute('vector-effect', 'non-scaling-stroke');
        line.style.animationDelay = (i * 80) + 'ms';
        line.classList.add('active');
        svg.appendChild(line);
      }
      
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', cx);
      circle.setAttribute('cy', cy);
      circle.setAttribute('r', '2');
      circle.setAttribute('fill', 'none');
      circle.setAttribute('stroke', '#fff');
      circle.setAttribute('stroke-width', '0.4');
      circle.setAttribute('vector-effect', 'non-scaling-stroke');
      circle.style.filter = 'drop-shadow(0 0 8px #fff) drop-shadow(0 0 15px #b39ddb)';
      circle.style.opacity = '0';
      circle.style.transition = 'opacity 0.5s';
      svg.appendChild(circle);
      setTimeout(() => { circle.style.opacity = '1'; }, 100);
    }

    function cargarDatosGuardados() {
      const guardado = localStorage.getItem('invitacionEmir');
      if (guardado) {
        try {
          const datos = JSON.parse(guardado);
          document.getElementById('nombre').value = datos.nombre || '';
          adultos = Number(datos.adultos) || 0;
          ninos = Number(datos.ninos) || 0;
          document.getElementById('count-adultos').innerText = adultos;
          document.getElementById('count-ninos').innerText = ninos;
          actualizarGemas();

          const notificacion = document.getElementById('notificacion-previo');
          notificacion.classList.remove('hidden');
          notificacion.innerHTML = `Ya has registrado tu asistencia como <b>${datos.nombre}</b> (${datos.asistira}).<br>Si deseas cambiar tu respuesta, edita el formulario y vuelve a confirmar.`;
        } catch(e) { console.log("Error al cargar datos previos:", e); }
      }
    }

    function startExperience() {
      const overlay = document.getElementById('start-overlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 800);
      
      const audio = document.getElementById('bg-music');
      if (audio) { audio.volume = 0.5; audio.play().catch(e => console.log('Audio:', e)); }
      
      const card = document.getElementById('invitation-card');
      card.style.display = 'flex';
    }

    function mostrarPantallaCierre(tipo) {
      const card = document.getElementById('invitation-card');
      const audio = document.getElementById('bg-music');
      if (audio) { audio.pause(); }
      
      const mensaje = tipo === 'Éxito' 
        ? `
          <h1 style="font-size: 5rem; margin-bottom: 20px; animation: gemBounce 2s infinite;">💎</h1>
          <h2 style="font-family:'Fredoka One'; color: #ec4899; font-size: 2rem; margin-bottom: 15px;">¡MISIÓN CONFIRMADA!</h2>
          <p style="color: #5e35b1; font-weight: 700; font-size: 1.1rem; line-height: 1.5;">Tu gema ha sido registrada.<br>¡Nos vemos en la batalla estelar!</p>
          <div style="margin-top: 30px; padding: 15px 20px; background: rgba(236,72,153,0.1); border-radius: 15px; border: 2px dashed #ec4899;">
            <p style="color: #ec4899; font-weight: 800; font-size: 1rem; margin: 0;">✨ Ya puedes cerrar esta página ✨</p>
          </div>
        `
        : `
          <h1 style="font-size: 5rem; margin-bottom: 20px;">💔</h1>
          <h2 style="font-family:'Fredoka One'; color: #9575cd; font-size: 2rem; margin-bottom: 15px;">Portal Cerrado</h2>
          <p style="color: #5e35b1; font-weight: 700; font-size: 1.1rem; line-height: 1.5;">¡Te extrañaremos en esta misión!</p>
          <div style="margin-top: 30px; padding: 15px 20px; background: rgba(126,87,194,0.1); border-radius: 15px; border: 2px dashed #7e57c2;">
            <p style="color: #7e57c2; font-weight: 800; font-size: 1rem; margin: 0;">✨ Ya puedes cerrar esta página ✨</p>
          </div>
        `;
      
      card.innerHTML = `
        <div style="text-align:center; padding: 40px 20px; animation: enterFromBottom 0.8s ease-out forwards;">
          ${mensaje}
        </div>
      `;
      card.style.display = 'flex';
      card.style.animation = 'none';
    }
  </script>
</body>
</html>
